<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
<title>MCP の位置づけ</title>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker><marker id="arr-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c62828"/></marker><marker id="arr-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arr-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9aa5b1"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="bold" fill="#1f2933" text-anchor="start">MCP: エージェント環境(クライアント)が外部のツールとデータに同じ作法でつながる</text>
<rect x="30" y="120" width="260" height="150" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
<text x="160.0" y="159.3" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">エージェント環境(MCP クライアント)</text>
<text x="160.0" y="179.6" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">Copilot CLI / アプリ、Claude Code、</text>
<text x="160.0" y="199.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">OpenCode、Codex …</text>
<text x="160.0" y="220.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle"></text>
<text x="160.0" y="240.5" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">設定ファイルにサーバーを列挙する</text>
<rect x="380" y="100" width="220" height="70" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="490.0" y="129.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">MCP サーバー(stdio)</text>
<text x="490.0" y="150.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">ローカルで起動する子プロセス</text>
<rect x="380" y="200" width="220" height="70" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="490.0" y="229.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">MCP サーバー(HTTP)</text>
<text x="490.0" y="250.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">リモートの URL に接続</text>
<rect x="700" y="100" width="230" height="70" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="815.0" y="129.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">外部のツール・データ</text>
<text x="815.0" y="150.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">Issue / PR、組織内の API、DB、文書</text>
<rect x="700" y="200" width="230" height="70" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="815.0" y="229.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">外部のツール・データ</text>
<text x="815.0" y="250.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">SaaS、検索、チケット</text>
<line x1="290" y1="150" x2="380" y2="135" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="335" y="190" font-size="12" fill="#52606d" text-anchor="middle">tools / resources / prompts</text>
<line x1="290" y1="220" x2="380" y2="235" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="600" y1="135" x2="700" y2="135" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="600" y1="235" x2="700" y2="235" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="30" y="300" width="900" height="90" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="480.0" y="330.7" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">設計判断と注意</text>
<text x="480.0" y="349.6" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">① ツール定義は開始時に全部文脈へ乗る(サーバーを足すほど毎依頼が重い)  ② ツール出力は信頼できない入力(命令が混ざっていても従わせない)</text>
<text x="480.0" y="368.4" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">③ 既に CLI があるものは MCP にせず、スキルからその CLI を叩く  ④ 書き込み系ツールは確認ダイアログを飛ばさない</text>
</svg>