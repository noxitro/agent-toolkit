<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
<title>フェーズゲートの 1 周</title>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker><marker id="arr-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c62828"/></marker><marker id="arr-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arr-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9aa5b1"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="bold" fill="#1f2933" text-anchor="start">フェーズゲートの 1 周: PASS しない限り次へ進まない。3 周で収束しなければ人に戻す</text>
<rect x="30" y="120" width="170" height="80" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="115.0" y="144.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">準備</text>
<text x="115.0" y="164.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">HARNESS.md の Phase N を</text>
<text x="115.0" y="185.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">復唱、未検証項目を引き継ぐ</text>
<rect x="260" y="120" width="170" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="345.0" y="144.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">実装</text>
<text x="345.0" y="164.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">@implementer</text>
<text x="345.0" y="185.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">ビルド・テスト・自己検証</text>
<rect x="490" y="120" width="170" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="575.0" y="144.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">審査</text>
<text x="575.0" y="164.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">@reviewer</text>
<text x="575.0" y="185.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">測り直し・陽性コントロール</text>
<rect x="720" y="120" width="210" height="80" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="825.0" y="144.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">締め</text>
<text x="825.0" y="164.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">差分確認 → 人がコミット →</text>
<text x="825.0" y="185.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">TEST_REPORT.md / phase-log.csv</text>
<line x1="200" y1="160" x2="260" y2="160" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="430" y1="160" x2="490" y2="160" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="460.0" y="108" font-size="12" fill="#52606d" text-anchor="middle">git diff 採取</text>
<line x1="660" y1="160" x2="720" y2="160" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="690.0" y="108" font-size="13" fill="#2e7d32" text-anchor="middle">PASS</text>
<path d="M 575 200 C 575 280, 345 280, 345 200" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="460" y="278" font-size="13" fill="#c62828" text-anchor="middle">FAIL: 再現手順付きで差し戻し(周回 +1)</text>
<rect x="260" y="320" width="400" height="60" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
<text x="460.0" y="345.1" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">周回が 3 を超えたら止めて人に戻す</text>
<text x="460.0" y="364.0" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">モデルを上げない。スコープ分割か要件見直しをリーダーが決める。記録は残す(判定: 上限到達)</text>
<line x1="460" y1="288" x2="460" y2="320" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="30" y="405" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">審査の前後で git diff を比較し、差分があれば VERDICT を無効にして再審査する(審査役が書き込んでいないことの事後検出)。</text>
</svg>