<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
<title>Copilot に振る舞いを与える部品と、いつ効くか</title>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker><marker id="arr-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c62828"/></marker><marker id="arr-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arr-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9aa5b1"/></marker></defs>
<rect width="960" height="570" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="bold" fill="#1f2933" text-anchor="start">Copilot に決まった振る舞いをさせる 4 つの部品と、それを組み合わせたユーザーハーネス</text>
<text x="30" y="66" font-size="14" font-weight="normal" fill="#52606d" text-anchor="start">横軸はセッションの時間。色の付いた区間で、その部品の内容がモデルの文脈(コンテキスト)に乗る</text>
<line x1="290" y1="110" x2="930" y2="110" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#arr-grey)"/>
<line x1="300" y1="102" x2="300" y2="118" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="300" y="96" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">セッション開始</text>
<line x1="520" y1="102" x2="520" y2="118" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="520" y="96" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">依頼を受けた</text>
<line x1="760" y1="102" x2="760" y2="118" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="760" y="96" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">作業中(ツール呼び出し)</text>
<rect x="30" y="140" width="250" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="42" y="155.7" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">指示</text>
<text x="42" y="174.6" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">AGENTS.md</text>
<text x="42" y="193.4" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">.github/copilot-instructions.md</text>
<rect x="300" y="158" width="630" height="24" rx="4" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.2"/>
<text x="615.0" y="175" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">常時(開始時に全文が乗る)</text>
<rect x="30" y="216" width="250" height="60" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
<text x="42" y="241.1" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">スキル</text>
<text x="42" y="260.0" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">.github/skills/&lt;name&gt;/SKILL.md</text>
<rect x="300" y="234" width="220" height="24" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="410.0" y="251" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">description だけ</text>
<rect x="520" y="234" width="410" height="24" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1.2"/>
<text x="725.0" y="251" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">本文(依頼が合致したときだけ読まれる)</text>
<rect x="30" y="292" width="250" height="60" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="42" y="317.1" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">カスタムエージェント</text>
<text x="42" y="336.0" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">.github/agents/&lt;name&gt;.agent.md</text>
<rect x="520" y="310" width="410" height="24" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.2"/>
<text x="725.0" y="327" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">人が選んだとき、または本体から委譲されたとき(別の文脈で動く)</text>
<rect x="30" y="368" width="250" height="60" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="42" y="393.1" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">MCP</text>
<text x="42" y="412.0" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">~/.copilot/mcp-config.json など</text>
<rect x="300" y="386" width="220" height="24" rx="4" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
<text x="410.0" y="403" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">ツール定義</text>
<rect x="760" y="386" width="170" height="24" rx="4" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
<text x="845.0" y="403" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle">呼び出しごとに実行</text>
<rect x="30" y="450" width="900" height="70" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="480.0" y="479.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">ユーザーハーネス = 上の 4 つを組み合わせて「実装役が作る → 審査役が検証する → ゲートを満たしたら次へ」を回す仕組み</text>
<text x="480.0" y="500.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">HARNESS.md(フェーズ定義とゲート条件)+ 実装役・審査役のエージェント + 起動スキル(phase-loop)+ 結果の置き場(TEST_REPORT.md)</text>
<text x="30" y="552" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">常時乗るもの(指示、description、MCP のツール定義)は 1 行増やすごとに全依頼のコストになる。手順は合致時だけ乗るスキル本文へ逃がす。</text>
</svg>