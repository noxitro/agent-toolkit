<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
<title>ユーザーハーネスの部品と、誰が何を読むか</title>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker><marker id="arr-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c62828"/></marker><marker id="arr-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arr-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9aa5b1"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="bold" fill="#1f2933" text-anchor="start">ユーザーハーネスの部品と、誰が何を読むか</text>
<text x="30" y="64" font-size="14" font-weight="normal" fill="#52606d" text-anchor="start">実線の矢印が 1 周の流れ(①〜④)。点線は「読む」関係。人が一から書くのは HARNESS.md だけで、残りは雛形をコピーする</text>
<rect x="30" y="110" width="130" height="70" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
<text x="95.0" y="139.4" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">人</text>
<text x="95.0" y="161.1" font-size="15" font-weight="normal" fill="#52606d" text-anchor="middle">リーダー / 作業者</text>
<rect x="220" y="110" width="200" height="70" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
<text x="320.0" y="139.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">phase-loop(スキル)</text>
<text x="320.0" y="160.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">1 周の手順を固定した起動文</text>
<rect x="480" y="110" width="200" height="70" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="580.0" y="139.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">オーケストレータ</text>
<text x="580.0" y="160.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">チャット本体。実装も判定もしない</text>
<rect x="740" y="110" width="190" height="70" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="835.0" y="139.8" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">TEST_REPORT.md</text>
<text x="835.0" y="160.1" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">phase-log.csv(結果と記録)</text>
<rect x="30" y="300" width="190" height="80" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="125.0" y="324.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">共通指示</text>
<text x="125.0" y="344.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">AGENTS.md /</text>
<text x="125.0" y="365.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">copilot-instructions.md</text>
<rect x="300" y="300" width="190" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="395.0" y="324.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">@implementer</text>
<text x="395.0" y="344.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">実装役。作って、ビルドと</text>
<text x="395.0" y="365.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">テストを通して、定型で報告</text>
<rect x="660" y="300" width="190" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="755.0" y="324.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">@reviewer</text>
<text x="755.0" y="344.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">審査役。読み取り専用。</text>
<text x="755.0" y="365.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">自分で測り直して VERDICT</text>
<rect x="360" y="450" width="240" height="80" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="480.0" y="474.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">HARNESS.md</text>
<text x="480.0" y="494.9" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">フェーズ定義・ゲート条件・運用則</text>
<text x="480.0" y="515.2" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">(人がエージェントと相談して書く)</text>
<line x1="160" y1="145" x2="220" y2="145" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190" y="100" font-size="12" fill="#52606d" text-anchor="middle">「Phase N を進めて」</text>
<line x1="420" y1="145" x2="480" y2="145" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="540" y1="180" x2="420" y2="300" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="440" y="235" font-size="13" fill="#52606d" text-anchor="middle">① 実装依頼</text>
<line x1="490" y1="320" x2="660" y2="320" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="575" y="292" font-size="12" fill="#52606d" text-anchor="middle">② 報告 → 審査前 git diff → 審査依頼</text>
<line x1="720" y1="300" x2="610" y2="180" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="745" y="235" font-size="12" fill="#52606d" text-anchor="middle">③ VERDICT → 審査後 git diff 比較</text>
<line x1="680" y1="145" x2="740" y2="145" stroke="#52606d" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="710" y="100" font-size="12" fill="#52606d" text-anchor="middle">④ PASS: 記録</text>
<path d="M 660 350 C 560 420, 500 420, 490 360" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr-red)"/>
<text x="575" y="412" font-size="12" fill="#c62828" text-anchor="middle">FAIL: 再現手順付きで差し戻し(最大 3 周)</text>
<line x1="395" y1="380" x2="440" y2="450" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#arr-grey)" stroke-dasharray="4 3"/>
<text x="395" y="425" font-size="13" fill="#9aa5b1" text-anchor="middle">読む</text>
<line x1="755" y1="380" x2="560" y2="450" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#arr-grey)" stroke-dasharray="4 3"/>
<text x="700" y="425" font-size="13" fill="#9aa5b1" text-anchor="middle">読む(ゲート条件)</text>
<line x1="580" y1="180" x2="520" y2="450" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#arr-grey)" stroke-dasharray="4 3"/>
<text x="568" y="430" font-size="13" fill="#9aa5b1" text-anchor="middle">読む</text>
<line x1="125" y1="300" x2="500" y2="180" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#arr-grey)" stroke-dasharray="4 3"/>
<text x="250" y="228" font-size="13" fill="#9aa5b1" text-anchor="middle">常時(全エージェントが読む)</text>
<text x="30" y="545" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">審査役の「直さない」は tools 制限 + 指示本文 + 審査前後の git diff 比較の三重で裏付ける。どれか 1 つでは保証にならない。</text>
</svg>