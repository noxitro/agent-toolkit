name: Link check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/link-check.yml'
  schedule:
    # Weekly, so link rot in published docs surfaces without waiting for a PR.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Generated files repeat the links of their sources, so only the sources are checked.
          args: >-
            --no-progress
            --max-retries 2
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path plugins
            --
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' }}

      # The report is handed to the issue job, which is the only one allowed to write issues.
      - name: Keep the report
        if: steps.lychee.outputs.exit_code != '0' && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md
          if-no-files-found: error

  # A scheduled run does not fail the workflow; it files one issue, or updates it while open.
  issue:
    name: Report broken links
    needs: lychee
    if: needs.lychee.outputs.exit_code != '0' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lychee-report
          path: lychee

      - name: Find the open link-check issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Link check failed"' --json number,title \
            --jq '[.[] | select(.title == "Link check failed")][0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check failed
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: docs
