name: Link check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/link-check.yml'
  schedule:
    # Weekly, so link rot in published docs surfaces without waiting for a PR.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Generated files repeat the links of their sources, so only the sources are checked.
          # Imported third-party skills keep the upstream text verbatim (including placeholder
          # links such as github.com/owner/repo), so their folders are skipped; the folder's own
          # README.md is still checked.
          args: >-
            --no-progress
            --max-retries 2
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path plugins
            --exclude-path m365-org-skills/third-party/.+/
            --
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' }}

      # A scheduled run does not fail the workflow; it files or updates one issue instead.
      - name: Open an issue on failure
        if: env.lychee_exit_code != '0' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check failed
          content-filepath: ./lychee/out.md
          labels: docs
