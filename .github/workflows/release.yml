name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # package.json is the single version source; validate.mjs already enforces that
      # plugin.json and marketplace.json agree with it. Here we only tie the tag to it.
      - name: Check the tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Validate and check generated output
        run: npm run check

      # Convenience payloads for the harnesses that install by copying files.
      - name: Package the per-harness distributions
        run: |
          mkdir -p artifacts
          zip -r artifacts/opencode.zip dist/opencode
          zip -r artifacts/copilot.zip dist/copilot

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/opencode.zip
            artifacts/copilot.zip
