name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # package.json is the single version source; validate.mjs already enforces that
      # plugin.json and marketplace.json agree with it. Here we only tie the tag to it.
      # The tag is user input (workflow_dispatch), so it reaches the shell only via env.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi

      - name: Validate and check generated output
        run: npm run check

      # Convenience payloads for the harnesses that install by copying files. Each archive
      # is zipped from inside its directory, so its root is the harness layout itself
      # (opencode: agent/, command/; copilot: skills/, prompts/, agents/) and it unpacks
      # straight into ~/.config/opencode/ or .github/.
      - name: Package the per-harness distributions
        run: |
          mkdir -p artifacts
          for h in opencode copilot; do
            (cd "dist/$h" && zip -r -X "$GITHUB_WORKSPACE/artifacts/$h.zip" .)
          done

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/opencode.zip
            artifacts/copilot.zip
