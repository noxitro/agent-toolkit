# Lints the workflows themselves (.github/workflows/*.yml) with actionlint: syntax, expressions,
# needs / matrix / permissions, and the bash in run: (actionlint runs the shellcheck on the runner).
# A broken workflow otherwise shows up only when it runs, or not at all for the release workflow.
#
# actionlint is pinned by version and checked against the SHA-256 written here, not against the
# release's own checksums.txt (a checksum from the same place is not an independent check).
# When updating, confirm the hash with both the release's checksums.txt and a local download.
name: Workflow lint

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
          # Without shellcheck, actionlint silently skips the run: scripts. Make that visible.
          if command -v shellcheck >/dev/null; then
            shellcheck --version
          else
            echo "::warning::shellcheck is missing, so the bash in run: is not checked"
          fi

      - name: actionlint
        shell: bash
        run: actionlint -color
