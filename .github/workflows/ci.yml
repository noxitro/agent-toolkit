name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Validate and check generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Shared-asset contract: required frontmatter, name/location agreement,
      # agentskills.io limits (name <= 64, description <= 1024), manifest consistency.
      - name: Validate shared assets and manifests
        run: npm run validate

      # The per-harness output is committed so users can install it without a build
      # step. This fails if it no longer matches shared/**.
      - name: Check generated output is up to date
        run: npm run build:check

      # Installer scenarios (Node and PowerShell versions).
      - name: Test
        run: npm test

  # The Windows installer (install.bat -> scripts/install-assets.ps1) must run on the Windows
  # PowerShell 5.1 that every Windows PC has, not only on the pwsh 7 the Linux job uses.
  installer-windows:
    name: Installer on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the Node and PowerShell installers
        run: node --test tests/install-assets.test.mjs

      # The test above only pretends symlinks are refused (AGENT_TOOLKIT_NO_SYMLINK). This one
      # turns Developer Mode off and drops administrator rights, so the installers' own check
      # has to notice and fall back to junctions.
      - name: Link mode on a PC without symlink rights
        shell: powershell
        run: .\tests\windows-no-symlink\run.ps1

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules
            !dist
            !plugins/*/skills
            !plugins/*/commands
            !plugins/*/agents
