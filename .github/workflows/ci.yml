name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Validate and check generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Shared-asset contract: required frontmatter, name/location agreement,
      # agentskills.io limits (name <= 64, description <= 1024), manifest consistency.
      - name: Validate shared assets and manifests
        run: npm run validate

      # The per-harness output is committed so users can install it without a build
      # step. This fails if it no longer matches shared/**.
      - name: Check generated output is up to date
        run: npm run build:check

      # Unit tests for the scripts that ship inside skills (ZIP writer, bundle format,
      # package validator, sandbox-side Python scripts).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Test skill scripts
        run: npm test

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !node_modules
            !dist
            !plugins/*/skills
            !plugins/*/commands
            !plugins/*/agents
