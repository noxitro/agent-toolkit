<body>
<main>
<h1>パッケージ作成の手順</h1>
<ol>
  <li>リポジトリのルートで依存関係を入れる。<pre>npm ci</pre></li>
  <li>リリース ビルドを作る。<pre>npm run build -- --release</pre> 成功すると <code>dist/</code> に実行ファイルができる。</li>
  <li>パッケージ スクリプトを実行する。<pre>npm run package</pre> 成功すると <code>out/&lt;name&gt;-&lt;version&gt;.zip</code> ができる。</li>
  <li>ZIP の中身を確認する。秘密情報が入っていないことを目視で確かめる。</li>
</ol>
<p>バージョン番号は <a href="naming.html">命名規則</a> に従います。</p>
</main>
</body>
</html>
