<h1>パッケージ作成の概要</h1>
<p>アプリケーションを配布可能な <strong>パッケージ</strong> にまとめる工程の説明です。署名と配布は<a href="../env/setup.html">環境セットアップ</a>のあとに別途行います。</p>
<h2>含めるもの</h2>
<ul>
  <li>ビルド済みの実行ファイル</li>
  <li>設定ファイルのテンプレート(<code>config.example.json</code>)</li>
  <li>変更履歴 <code>CHANGELOG.md</code></li>
</ul>
<h2>含めないもの</h2>
<ul>
  <li>秘密情報(トークン、鍵)</li>
  <li>開発者のローカル設定</li>
</ul>
<p>手順は <a href="steps.html">パッケージ作成の手順</a>、名前の付け方は <a href="naming.html">命名規則</a> を参照してください。</p>
</main>
</body>
</html>
