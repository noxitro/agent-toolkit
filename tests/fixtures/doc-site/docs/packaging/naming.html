<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>パッケージの命名規則</title></head>
<body>
<main>
<h1>パッケージの命名規則</h1>
<p>ファイル名は <code>&lt;name&gt;-&lt;version&gt;.zip</code> とします。</p>
<table>
  <tr><th>要素</th><th>規則</th><th>例</th></tr>
  <tr><td>name</td><td>小文字とハイフンのみ</td><td>order-service</td></tr>
  <tr><td>version</td><td><a href="https://semver.org/lang/ja/">セマンティック バージョニング</a></td><td>1.4.0</td></tr>
</table>
<p>プレリリースには <code>-rc.1</code> のように接尾辞を付けます。</p>
</main>
</body>
</html>
